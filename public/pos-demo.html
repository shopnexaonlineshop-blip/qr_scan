<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .full {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d0d7e2;
      font-size: 15px;
    }
    .note {
      background: #eef4ff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>POS Demo</h1>
    <div class="note">
      Click inside any field below, then scan from mobile.  
      The scanned text will go into the selected field.
    </div>

    <div class="grid">
      <div>
        <label>Product Code</label>
        <input type="text" placeholder="Click here and scan" />
      </div>

      <div>
        <label>Customer ID</label>
        <input type="text" placeholder="Click here and scan" />
      </div>

      <div>
        <label>Order Number</label>
        <input type="text" placeholder="Click here and scan" />
      </div>

      <div>
        <label>Payment Ref</label>
        <input type="text" placeholder="Click here and scan" />
      </div>

      <div class="full">
        <label>Notes</label>
        <textarea rows="5" placeholder="Click here and scan"></textarea>
      </div>
    </div>
  </div>

  <script>
    window.QR_SYNC_SERVER_URL = window.location.origin;
    window.QR_SYNC_ROOM_ID = "pos-room";
    window.QR_SYNC_APPEND_MODE = false;
  </script>
  <script src="/pos-listener.js"></script>
</body>
</html>
