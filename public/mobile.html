<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Scanner</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    input {
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .btn-blue { background: #3b82f6; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .btn-red { background: #ef4444; color: white; }

    #reader {
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .result {
      min-height: 50px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Hosted QR Scanner</h2>
      <input id="roomId" placeholder="Room ID" />
      <button class="btn-blue" id="joinBtn">Join Room</button>
      <div id="joinStatus">Not joined</div>
    </div>

    <div class="card">
      <div id="reader"></div>
      <button class="btn-green" id="startBtn">Start Scanner</button>
      <button class="btn-red" id="stopBtn">Stop Scanner</button>
    </div>

    <div class="card">
      <strong>Last scanned:</strong>
      <div class="result" id="lastScan">No scan yet</div>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);

    const roomIdInput = document.getElementById("roomId");
    const joinBtn = document.getElementById("joinBtn");
    const joinStatus = document.getElementById("joinStatus");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const lastScan = document.getElementById("lastScan");

    roomIdInput.value = params.get("room") || "shop-counter-1";

    let currentRoom = roomIdInput.value;
    let scanner = null;
    let scannerRunning = false;
    let lastText = "";
    let lastTime = 0;

    function joinRoom() {
      const room = roomIdInput.value.trim();
      if (!room) {
        alert("Enter room ID");
        return;
      }
      currentRoom = room;
      socket.emit("join-room", room);
    }

    joinBtn.addEventListener("click", joinRoom);

    socket.on("joined-room", (room) => {
      joinStatus.textContent = "Joined room: " + room;
    });

    async function startScanner() {
      if (scannerRunning) return;

      joinRoom();
      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            const now = Date.now();

            if (decodedText === lastText && now - lastTime < 1500) return;

            lastText = decodedText;
            lastTime = now;

            lastScan.textContent = decodedText;

            socket.emit("scanned-data", {
              roomId: currentRoom,
              text: decodedText
            });
          },
          () => {}
        );

        scannerRunning = true;
      } catch (err) {
        alert("Camera start failed: " + err);
      }
    }

    async function stopScanner() {
      if (!scanner || !scannerRunning) return;

      try {
        await scanner.stop();
        await scanner.clear();
        scannerRunning = false;
      } catch (err) {
        console.error(err);
      }
    }

    startBtn.addEventListener("click", startScanner);
    stopBtn.addEventListener("click", stopScanner);
    window.addEventListener("load", joinRoom);
  </script>
</body>
</html>
